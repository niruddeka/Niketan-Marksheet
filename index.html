<!DOCTYPE html>
<html lang="as">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নিকেতনৰ প্ৰগতি পত্ৰ - ২০২৬</title>
    <style>
        body { font-family: 'Arial', sans-serif; padding: 10px; background: #fff; }
        .no-print { background: #f9f9f9; padding: 15px; border: 1px solid #ccc; max-width: 450px; margin: auto; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 10px 0; border: 1px solid #999; border-radius: 4px; box-sizing: border-box; }
        .btn-save { width: 100%; padding: 12px; background: #1b5e20; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-pdf { width: 100%; padding: 12px; background: #0d47a1; color: white; border: none; margin-top: 5px; font-weight: bold; cursor: pointer; }
        
        /* সেই পুৰণা ১ম গোটৰ ডিজাইনটো */
        .print-area { display: none; width: 100%; max-width: 500px; margin: 20px auto; padding: 15px; border: 2px solid #000; }
        .school-title { text-align: center; font-size: 20px; font-weight: bold; }
        .info-row { display: flex; justify-content: space-between; margin-top: 10px; border-bottom: 1px solid #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid black; padding: 5px; text-align: center; }
        .sub-name { text-align: left; padding-left: 5px; font-weight: bold; }

        @media print { .no-print { display: none; } .print-area { display: block; } }
    </style>
</head>
<body>

<div class="no-print">
    <h3 style="text-align:center;">নম্বৰ এন্ট্ৰি ফৰ্ম</h3>
    <input type="text" id="inSchool" oninput="sync()" placeholder="বিদ্যালয়ৰ নাম">
    <input type="text" id="inYear" oninput="sync()" value="২০২৬">
    <select id="inExam" onchange="sync()">
        <option value="প্ৰথম গোট">১ম গোট মূল্যায়ন</option>
        <option value="ছয় মাহিলী">৬ মাহিলী মূল্যায়ন</option>
        <option value="দ্বিতীয় গোট">২য় গোট মূল্যায়ন</option>
        <option value="ন-মাহিলী">ন-মাহিলী মূল্যায়ন</option>
        <option value="বছৰেকীয়া">বছৰেকীয়া মূল্যায়ন</option>
        <option value="তৃতীয় গোট">৩য় গোট মূল্যায়ন</option>
    </select>
    <input type="number" id="inRoll" oninput="sync()" placeholder="ৰোল নম্বৰ">
    <input type="text" id="inName" oninput="sync()" placeholder="ছাত্ৰৰ নাম">
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
        <input type="number" id="m1" oninput="sync()" placeholder="অসমীয়া">
        <input type="number" id="m2" oninput="sync()" placeholder="ইংৰাজী">
        <input type="number" id="m3" oninput="sync()" placeholder="গণিত">
        <input type="number" id="m4" oninput="sync()" placeholder="হিন্দী">
        <input type="number" id="m5" oninput="sync()" placeholder="বিজ্ঞান">
        <input type="number" id="m6" oninput="sync()" placeholder="সমাজ বি.">
        <input type="number" id="m7" oninput="sync()" placeholder="সংস্কৃত">
        <input type="number" id="m8" oninput="sync()" placeholder="নীতিশিক্ষা">
        <input type="number" id="m9" oninput="sync()" placeholder="পৰিৱেশ">
        <input type="number" id="m10" oninput="sync()" placeholder="কম্পিউটাৰ">
        <input type="number" id="m11" oninput="sync()" placeholder="ছবি">
    </div>

    <button class="btn-save" onclick="send()">শ্বীটত জমা কৰক</button>
    <button class="btn-pdf" onclick="window.print()">পিডিএফ (PDF)</button>
</div>

<div class="print-area">
    <div class="school-title" id="vSchool">বিদ্যালয়ৰ নাম</div>
    <div style="text-align:center; font-weight:bold;"><span id="vExam">পৰীক্ষাৰ নাম</span> - <span id="vYear">২০২৬</span></div>
    <div class="info-row">
        <span>নাম: <span id="vName">........</span></span>
        <span>ৰোল নং: <span id="vRoll">..</span></span>
    </div>
    <table>
        <tr><th>বিষয়</th><th>পূৰ্ণ নম্বৰ</th><th>প্ৰাপ্ত নম্বৰ</th></tr>
        <tbody id="vBody"></tbody>
    </table>
    <div style="margin-top: 30px; display: flex; justify-content: space-between; font-weight: bold;">
        <span>আচাৰ্যৰ স্বাক্ষৰ</span>
        <span>প্ৰধান আচাৰ্যৰ স্বাক্ষৰ</span>
    </div>
</div>

<script>
    function sync() {
        document.getElementById('vSchool').innerText = document.getElementById('inSchool').value || "বিদ্যালয়ৰ নাম";
        document.getElementById('vExam').innerText = document.getElementById('inExam').value;
        document.getElementById('vYear').innerText = document.getElementById('inYear').value;
        document.getElementById('vName').innerText = document.getElementById('inName').value || "........";
        document.getElementById('vRoll').innerText = document.getElementById('inRoll').value || "..";
        let subs = ["অসমীয়া", "ইংৰাজী", "গণিত", "হিন্দী", "বিজ্ঞান", "সমাজ বি.", "সংস্কৃত", "নীতিশিক্ষা", "পৰিৱেশ", "কম্পিউটাৰ", "ছবি"];
        let h = "";
        for(let i=1; i<=11; i++) {
            let val = document.getElementById('m'+i).value || "0";
            h += `<tr><td class="sub-name">${subs[i-1]}</td><td>১০০/৫০</td><td>${val}</td></tr>`;
        }
        document.getElementById('vBody').innerHTML = h;
    }
    function send() {
        const url = 'https://script.google.com/macros/s/AKfycbzUnisi6n7tSr0FszO2yIfkQsdxeCB6V4LAIVqbbPDC-TyA9Fl19YkqAhTlEYO9yYLv/exec';
        let d = new URLSearchParams();
        d.append("examType", document.getElementById('inExam').value);
        d.append("roll", document.getElementById('inRoll').value);
        d.append("name", document.getElementById('inName').value);
        for(let i=1; i<=11; i++) d.append("m"+i, document.getElementById('m'+i).value);
        fetch(url, { method: 'POST', mode: 'no-cors', body: d }).then(() => alert('জমা হ’ল!'));
    }
    sync();
</script>
</body>
</html>
