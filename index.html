<!DOCTYPE html>
<html lang="as">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; padding: 10px; background-color: #f4f4f4; }
        .edit-section { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .marksheet-preview { background: white; border: 1px solid black; padding: 25px; width: 100%; max-width: 700px; margin: 0 auto; box-sizing: border-box; }
        h2, h3, h4 { margin: 5px; text-align: center; }
        .student-details { text-align: left; margin-top: 20px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid black; padding: 10px; text-align: center; }
        input { margin-bottom: 8px; padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 10px; flex: 1; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-update { background: #2196F3; color: white; }
        .btn-download { background: #4CAF50; color: white; }
        @media print { .edit-section { display: none; } .marksheet-preview { border: none; } }
    </style>
</head>
<body>

    <div class="edit-section">
        <h3>মাৰ্কশ্বীট এডিটৰ (Input)</h3>
        <input type="text" id="inSchool" placeholder="স্কুলৰ নাম" value="শংকৰদেৱ শিশু নিকেতন, ভূৰাগাঁও">
        <input type="text" id="inExam" placeholder="পৰীক্ষা আৰু চন" value="প্ৰথম গোট পৰীক্ষা – ২০২৬">
        <input type="text" id="inClass" placeholder="শ্ৰেণী" value="অংকুৰ">
        <input type="text" id="inName" placeholder="ছাত্ৰ/ছাত্ৰীৰ নাম">
        <input type="text" id="inRoll" placeholder="ৰোল নং">
        
        <div style="display: flex; gap: 5px;">
            <input type="number" id="mAssam" placeholder="অসমীয়া নম্বৰ" oninput="calculateTotal()">
            <input type="number" id="mMath" placeholder="গণিত নম্বৰ" oninput="calculateTotal()">
        </div>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="mGK" placeholder="সাঃ জ্ঞান নম্বৰ" oninput="calculateTotal()">
            <input type="number" id="mDrawing" placeholder="ছবি নম্বৰ" oninput="calculateTotal()">
        </div>

        <div class="btn-group">
            <button class="btn-update" onclick="updateMarksheet()">Update Preview</button>
            <button class="btn-download" onclick="downloadPDF()">Download PDF</button>
        </div>
    </div>

    <div id="marksheet-pdf" class="marksheet-preview">
        <h2 id="outSchool">শংকৰদেৱ শিশু নিকেতন, ভূৰাগাঁও</h2>
        <h3 id="outExam">প্ৰথম গোট পৰীক্ষা – ২০২৬</h3>
        <h4 id="outClass">শ্ৰেণীঃ – অংকুৰ</h4>
        
        <div class="student-details">
            <p>ছাত্ৰ/ছাত্ৰীৰ নামঃ <span id="outName">................................</span></p>
            <p>ৰোল নংঃ <span id="outRoll">................</span></p>
        </div>

        <table>
            <tr>
                <th>বিষয়</th>
                <th>মুঠ নম্বৰ</th>
                <th>প্ৰাপ্ত নম্বৰ</th>
                <th>২০%</th>
            </tr>
            <tr><td>অসমীয়া</td><td>৫০</td><td id="rAssam"></td><td id="wAssam"></td></tr>
            <tr><td>গণিত</td><td>৫০</td><td id="rMath"></td><td id="wMath"></td></tr>
            <tr><td>সাধাৰণ জ্ঞান</td><td>৫০</td><td id="rGK"></td><td id="wGK"></td></tr>
            <tr><td>ছবি</td><td>৫০</td><td id="rDrawing"></td><td id="wDrawing"></td></tr>
            <tr style="font-weight: bold;">
                <td>মুঠ</td>
                <td id="totalFull">২০০</td>
                <td id="totalObtained"></td>
                <td id="totalWeight"></td>
            </tr>
        </table>
    </div>

    <script>
        function updateMarksheet() {
            document.getElementById('outSchool').innerText = document.getElementById('inSchool').value;
            document.getElementById('outExam').innerText = document.getElementById('inExam').value;
            document.getElementById('outClass').innerText = "শ্ৰেণীঃ – " + document.getElementById('inClass').value;
            document.getElementById('outName').innerText = document.getElementById('inName').value || "................................";
            document.getElementById('outRoll').innerText = document.getElementById('inRoll').value || "................";
            
            calculateTotal();
        }

        function calculateTotal() {
            let subjects = ['Assam', 'Math', 'GK', 'Drawing'];
            let totalMarks = 0;
            
            subjects.forEach(sub => {
                let val = parseFloat(document.getElementById('m' + sub).value) || 0;
                document.getElementById('r' + sub).innerText = val;
                let weight = (val * 20 / 50).toFixed(1); // ৫০ ৰ ভিতৰত পৰীক্ষা ধৰা হৈছে
                document.getElementById('w' + sub).innerText = weight;
                totalMarks += val;
            });

            document.getElementById('totalObtained').innerText = totalMarks;
            document.getElementById('totalWeight').innerText = (totalMarks * 20 / 200).toFixed(1);
        }

        function downloadPDF() {
            const element = document.getElementById('marksheet-pdf');
            const opt = {
                margin: 10,
                filename: document.getElementById('inName').value + '_Marksheet.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
