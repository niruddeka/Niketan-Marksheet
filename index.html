<!DOCTYPE html>
<html lang="as">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্ৰগতি পত্ৰ ২০২৬</title>
    <style>
        body { font-family: 'Arial', sans-serif; padding: 10px; }
        .no-print { background: #f0f0f0; padding: 15px; border-radius: 8px; max-width: 450px; margin: auto; border: 1px solid #ccc; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 10px 0; border: 1px solid #888; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; color: white; }
        .save { background: #1b5e20; }
        .pdf { background: #0d47a1; margin-top: 5px; }
        
        /* মাৰ্কশ্বীট ডিজাইন */
        .print-area { display: none; width: 100%; max-width: 550px; margin: 20px auto; padding: 20px; border: 2px solid #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid black; padding: 6px; text-align: center; }
        @media print { .no-print { display: none; } .print-area { display: block; } }
    </style>
</head>
<body>

<div class="no-print">
    <h3 style="text-align:center;">নম্বৰ এন্ট্ৰি ফৰ্ম</h3>
    <input type="text" id="inSchool" oninput="sync()" placeholder="বিদ্যালয়ৰ নাম">
    <select id="inExam" onchange="sync()">
        <option value="প্ৰথম গোট">১ম গোট (২০%)</option>
        <option value="ছয় মাহিলী">৬ মাহিলী (৩০%)</option>
        <option value="বছৰেকীয়া">বছৰেকীয়া (৫০%)</option>
    </select>
    <input type="number" id="inRoll" oninput="sync()" placeholder="ৰোল নং">
    <input type="text" id="inName" oninput="sync()" placeholder="ছাত্ৰৰ নাম">
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
        <input type="number" id="m1" oninput="sync()" placeholder="অসমীয়া">
        <input type="number" id="m2" oninput="sync()" placeholder="ইংৰাজী">
        <input type="number" id="m3" oninput="sync()" placeholder="গণিত">
        <input type="number" id="m4" oninput="sync()" placeholder="হিন্দী">
        <input type="number" id="m5" oninput="sync()" placeholder="বিজ্ঞান">
        <input type="number" id="m6" oninput="sync()" placeholder="সমাজ বি.">
    </div>

    <button class="save" onclick="send()">শ্বীটত জমা কৰক</button>
    <button class="pdf" onclick="window.print()">পিডিএফ (PDF) কৰক</button>
</div>

<div class="print-area">
    <h2 style="text-align:center;" id="vSchool">বিদ্যালয়ৰ নাম</h2>
    <h4 style="text-align:center;"><span id="vExam">পৰীক্ষা</span> - ২০২৬</h4>
    <p>নাম: <span id="vName">........</span> | ৰোল: <span id="vRoll">..</span></p>
    <table>
        <tr><th>বিষয়</th><th>পূৰ্ণ নম্বৰ</th><th>প্ৰাপ্ত নম্বৰ</th><th>শতাংশ (%)</th></tr>
        <tbody id="vBody"></tbody>
    </table>
</div>

<script>
    function sync() {
        document.getElementById('vSchool').innerText = document.getElementById('inSchool').value || "বিদ্যালয়ৰ নাম";
        document.getElementById('vExam').innerText = document.getElementById('inExam').value;
        document.getElementById('vName').innerText = document.getElementById('inName').value || "........";
        document.getElementById('vRoll').innerText = document.getElementById('inRoll').value || "..";
        
        let ex = document.getElementById('inExam').value;
        let p = 0.20; if(ex=="ছয় মাহিলী") p=0.30; if(ex=="বছৰেকীয়া") p=0.50;
        
        let subs = ["অসমীয়া", "ইংৰাজী", "গণিত", "হিন্দী", "বিজ্ঞান", "সমাজ বি."];
        let h = "";
        for(let i=1; i<=6; i++) {
            let val = document.getElementById('m'+i).value || "0";
            let calc = (val * p).toFixed(1);
            h += `<tr><td>${subs[i-1]}</td><td>১০০</td><td>${val}</td><td>${calc}</td></tr>`;
        }
        document.getElementById('vBody').innerHTML = h;
    }
    function send() {
        const url = 'https://script.google.com/macros/s/AKfycbwrdvRUgl_M8L-ChAC77xcC3u9ccNp-c3hGl-jMiXNLipk7wxvLDFElG1jVqDfD5eYF/exec';
        let d = new URLSearchParams();
        d.append("examType", document.getElementById('inExam').value);
        d.append("roll", document.getElementById('inRoll').value);
        d.append("name", document.getElementById('inName').value);
        for(let i=1; i<=11; i++) {
            let val = document.getElementById('m'+i) ? document.getElementById('m'+i).value : "0";
            d.append("m"+i, val);
        }
        fetch(url, { method: 'POST', mode: 'no-cors', body: d }).then(() => alert('জমা হ’ল!'));
    }
    sync();
</script>
</body>
</html>
