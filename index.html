<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নম্বৰ এন্ট্ৰি - ভৰাগাঁও শংকৰদেৱ শিশু নিকেতন</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f2f5; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center;">নম্বৰ এন্ট্ৰি কৰক</h2>
        <form id="marksForm">
            <select name="examType" id="examType" required>
                <option value="প্ৰথম গোট">প্ৰথম গোট</option>
                <option value="ছয় মাহিলী">ছয় মাহিলী</option>
                <option value="দ্বিতীয় গোট">দ্বিতীয় গোট</option>
                <option value="ন-মাহিলী">ন-মাহিলী</option>
                <option value="বছৰেকীয়া">বছৰেকীয়া</option>
            </select>
            
            <input type="number" name="roll" id="roll" placeholder="ৰোল নম্বৰ দিয়ক" required>
            
            <div class="grid">
                <input type="number" name="asm" placeholder="অসমীয়া">
                <input type="number" name="eng" placeholder="ইংৰাজী">
                <input type="number" name="math" placeholder="গণিত">
                <input type="number" name="hin" placeholder="হিন্দী">
                <input type="number" name="sci" placeholder="বিজ্ঞান">
                <input type="number" name="ss" placeholder="সমাজ বি.">
                <input type="number" name="san" placeholder="সংস্কৃত">
                <input type="number" name="mre" placeholder="নীতিশিক্ষা">
                <input type="number" name="env" placeholder="পৰিৱেশ">
                <input type="number" name="comp" placeholder="কম্পিউটাৰ">
                <input type="number" name="art" placeholder="ছবি/Drawing">
            </div>
            
            <button type="button" onclick="submitData()">Submit কৰক</button>
        </form>
    </div>

    <script>
        function submitData() {
            // নিৰুদ দা, ইয়াত আপোনাৰ সেই Google Apps Script-ৰ লিংকটো দিব লাগিব
            const scriptURL = 'https://script.google.com/macros/s/AKfycbyHlCS9QsE6ZAcg15aiUxpOS1czfHL55Ji5Ncx3r0HkqkEo4hoJBz6lq9vk3LwyqbN7/exec';
            const form = document.getElementById('marksForm');
            
            // মই আগতে বনোৱা সেই saveData ফাংচনটোলৈ ডাটা পঠাম
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            }).then(() => {
                alert('নম্বৰ সফলভাৱে জমা হ’ল!');
                form.reset();
            }).catch(err => alert('ভুল হৈছে: ' + err));
        }
    </script>
</body>
</html>
