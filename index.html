<!DOCTYPE html>
<html lang="as">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নিকেতন মাৰ্কশ্বীট - ৫০ নম্বৰ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; }
        .form-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { text-align: center; color: #2c3e50; font-size: 18px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 20px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .weightage-text { font-size: 12px; color: #e67e22; font-weight: normal; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>শংকৰদেৱ শিশু নিকেতন, ভূৰাগাঁও</h2>
    <p style="text-align:center; margin-top:-10px;">প্ৰথম গোট পৰীক্ষা – ২০২৬</p>
    
    <label>ছাত্ৰ/ছাত্ৰীৰ নাম (অসমীয়াত লিখক):</label>
    <input type="text" id="name" placeholder="যেনে: ৰমেন ডেকা">
    
    <label>ৰোল নং:</label>
    <input type="number" id="roll" placeholder="ৰোল লিখক">
    
    <hr>
    <h4 style="margin-bottom:5px;">নম্বৰ ভৰাওক (৫০ ৰ ভিতৰত):</h4>
    
    <label>অসমীয়া: <span id="as20" class="weightage-text">(২০%: ০)</span></label>
    <input type="number" id="as" oninput="calculateWeightage('as', 'as20')">
    
    <label>গণিত: <span id="math20" class="weightage-text">(২০%: ০)</span></label>
    <input type="number" id="math" oninput="calculateWeightage('math', 'math20')">
    
    <label>সাধাৰণ জ্ঞান: <span id="gk20" class="weightage-text">(২০%: ০)</span></label>
    <input type="number" id="gk" oninput="calculateWeightage('gk', 'gk20')">
    
    <label>ছবি: <span id="drawing20" class="weightage-text">(২০%: ০)</span></label>
    <input type="number" id="drawing" oninput="calculateWeightage('drawing', 'drawing20')">

    <button onclick="submitData()">Submit & Print PDF</button>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzCYIYaLvaqLFAaR_whQfKVy9bn_v5vCB9gdG3tby92pJKFbWFzgNmUtYJcJ2foWe4/exec';

    // ইংৰাজী নম্বৰক অসমীয়া নম্বৰলৈ নিবলৈ ফাংচন
    function toAssameseNumber(num) {
        const assameseDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return num.toString().split('').map(d => assameseDigits[d] || d).join('');
    }

    function calculateWeightage(inputId, spanId) {
        let val = document.getElementById(inputId).value;
        let weight = val ? (val * 0.2).toFixed(1) : 0;
        document.getElementById(spanId).innerText = "(২০%: " + toAssameseNumber(weight) + ")";
    }

    function submitData() {
        const name = document.getElementById('name').value;
        const roll = document.getElementById('roll').value;
        
        const subjects = [
            { sub: 'অসমীয়া', mark: document.getElementById('as').value },
            { sub: 'গণিত', mark: document.getElementById('math').value },
            { sub: 'সাধাৰণ জ্ঞান', mark: document.getElementById('gk').value },
            { sub: 'ছবি', mark: document.getElementById('drawing').value }
        ];

        subjects.forEach(item => {
            if(item.mark !== "") {
                fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: name,
                        roll: roll,
                        className: 'অংকুৰ',
                        subject: item.sub,
                        fullMarks: 50,
                        obtained: item.mark,
                        weightage: (item.mark * 0.2).toFixed(1)
                    })
                });
            }
        });

        generatePDF(name, roll, subjects);
    }

    function generatePDF(name, roll, subjects) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // হেডাৰ (অসমীয়া ফন্টৰ বাবে ডিফল্ট ফন্টত অসমীয়া দেখা নাযাব পাৰে, 
        // সেয়েহে ইয়াত আমি ইংৰাজীতে ৰাখিছোঁ কিন্তু আপুনি এপত অসমীয়া দেখিব)
        doc.setFontSize(16);
        doc.text("SHANKARDEV SHISHU NIKETAN, BHURAGAON", 105, 20, { align: "center" });
        doc.setFontSize(12);
        doc.text("FIRST UNIT TEST - 2026", 105, 28, { align: "center" });
        doc.text("Class: ANKUR", 105, 36, { align: "center" });
        
        doc.text("Name: " + name, 20, 50);
        doc.text("Roll No: " + toAssameseNumber(roll), 20, 58);
        
        // টেবুল
        doc.rect(20, 65, 170, 70);
        doc.line(20, 75, 190, 75);
        doc.text("Subject", 25, 71);
        doc.text("Full Marks", 80, 71);
        doc.text("Obtained", 120, 71);
        doc.text("20%", 160, 71);
        
        let y = 85;
        let totalObtained = 0;
        let total20 = 0;
        
        subjects.forEach(s => {
            doc.text(s.sub, 25, y);
            doc.text("50", 85, y);
            doc.text(s.mark.toString(), 125, y);
            let w = (s.mark * 0.2).toFixed(1);
            doc.text(w.toString(), 165, y);
            totalObtained += Number(s.mark);
            total20 += Number(w);
            y += 12;
        });
        
        doc.line(20, 125, 190, 125);
        doc.text("Total", 25, 131);
        doc.text("200", 85, 131);
        doc.text(totalObtained.toString(), 125, 131);
        doc.text(total20.toFixed(1).toString(), 165, 131);
        
        doc.save(name + "_Marksheet.pdf");
    }
</script>

</body>
</html>
