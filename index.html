<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নম্বৰ এন্ট্ৰি প্ৰপত্ৰ - ২০২৬</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #eef2f3; padding: 15px; }
        .box { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); max-width: 500px; margin: auto; }
        h2 { text-align: center; color: #1a5276; font-size: 18px; margin-bottom: 20px; border-bottom: 2px solid #1a5276; padding-bottom: 10px; }
        label { font-weight: bold; font-size: 14px; margin-top: 10px; display: block; }
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #bdc3c7; border-radius: 8px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-submit { width: 100%; padding: 15px; background: #28b463; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-submit:hover { background: #239b56; }
        .btn-pdf { width: 100%; padding: 12px; background: #2e86c1; color: white; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>পৰীক্ষাৰ নম্বৰ এন্ট্ৰি ফৰ্ম</h2>
    <form id="marksForm">
        <label>বিদ্যালয়/নিকেতনৰ নাম:</label>
        <input type="text" name="schoolName" placeholder="নিকেতনৰ নাম লিখক" required>

        <label>পৰীক্ষা বাছি লওক:</label>
        <select name="examType" required>
            <option value="প্ৰথম গোট">১ম গোট মূল্যায়ন</option>
            <option value="ছয় মাহিলী">৬ মাহিলী মূল্যায়ন</option>
            <option value="দ্বিতীয় গোট">২য় গোট মূল্যায়ন</option>
            <option value="ন-মাহিলী">ন-মাহিলী মূল্যায়ন</option>
            <option value="বছৰেকীয়া">বছৰেকীয়া মূল্যায়ন</option>
            <option value="তিলিমাহিলী">তিনিমাহিলী মূল্যায়ন</option>
        </select>

        <div class="grid">
            <div>
                <label>ৰোল নম্বৰ:</label>
                <input type="number" name="roll" required>
            </div>
            <div>
                <label>ছাত্ৰ/ছাত্ৰীৰ নাম:</label>
                <input type="text" name="name" required>
            </div>
        </div>

        <label style="text-align:center; color:#e67e22; font-size:16px;">বিষয়সমূহৰ নম্বৰ (Marks)</label>
        <div class="grid">
            <input type="number" name="asm" placeholder="অসমীয়া">
            <input type="number" name="eng" placeholder="ইংৰাজী">
            <input type="number" name="math" placeholder="গণিত">
            <input type="number" name="hin" placeholder="হিন্দী">
            <input type="number" name="sci" placeholder="বিজ্ঞান">
            <input type="number" name="ss" placeholder="সমাজ বি.">
            <input type="number" name="san" placeholder="সংস্কৃত">
            <input type="number" name="mre" placeholder="নীতিশিক্ষা">
            <input type="number" name="env" placeholder="পৰিৱেশ">
            <input type="number" name="comp" placeholder="কম্পিউটাৰ">
            <input type="number" name="art" placeholder="ছবি/অংকন">
        </div>

        <button type="button" class="btn-submit" onclick="submitData()">গুগল শ্বীটত জমা কৰক</button>
        <button type="button" class="btn-pdf" onclick="window.print()">পিডিএফ (PDF) কৰক</button>
    </form>
</div>

<script>
    function submitData() {
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwr-ix8M1Z_pwSgIuGUyMK1jTT8NC1k1lz8cI-wn5HVapBJeCnoif5Qm3AUIdrjLU-U/exec';
        const form = document.getElementById('marksForm');
        
        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            body: new URLSearchParams(new FormData(form))
        })
        .then(() => {
            alert('সফলভাৱে জমা হৈছে, নিৰুদ দা!');
            form.reset();
        })
        .catch(error => alert('ভুল হৈছে! আকৌ চেষ্টা কৰক।'));
    }
</script>

</body>
</html>
